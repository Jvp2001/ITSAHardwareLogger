name: Email release announcement

on:
  release:
    types: [published]

permissions: {}

jobs:
  email-subscribers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send release announcement
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELEASE_EMAIL_RECIPIENTS: ${{ secrets.RELEASE_EMAIL_RECIPIENTS }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"].strip()
          app_password = os.environ["GMAIL_APP_PASSWORD"].strip()
          recipients = [
              address.strip()
              for address in os.environ["RELEASE_EMAIL_RECIPIENTS"].replace(";", ",").split(",")
              if address.strip()
          ]

          if not username or not app_password or not recipients:
              raise SystemExit(
                  "Set GMAIL_USERNAME, GMAIL_APP_PASSWORD, and RELEASE_EMAIL_RECIPIENTS "
                  "in repository Actions secrets."
              )

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              release = json.load(event_file)["release"]

          title = release.get("name") or release["tag_name"]
          url = release["html_url"]
          notes = (release.get("body") or "").strip()
          body = f"A new version of ITSA Hardware Logger has been released: {title}\n\n{url}"
          if notes:
              body += f"\n\nRelease notes:\n{notes}"

          message = EmailMessage()
          message["From"] = username
          message["To"] = "Release subscribers"
          message["Subject"] = f"New ITSA Hardware Logger release: {title}"
          message.set_content(body)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(username, app_password)
              smtp.send_message(message, from_addr=username, to_addrs=recipients)
          PY
